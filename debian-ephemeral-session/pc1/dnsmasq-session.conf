# dnsmasq-session.conf — DHCP+DNS для ПК2 на интерфейсе LAN.
# Устанавливается в /etc/dnsmasq.d/session.conf (интерфейс подставляет install.sh).
#
# LAN-адрес ПК1 задаётся статически (по умолчанию 10.10.0.1/24).

interface=enp3s0
bind-dynamic
dhcp-range=10.10.0.50,10.10.0.60,255.255.255.0,12h
dhcp-option=option:router,10.10.0.1
dhcp-option=option:dns-server,10.10.0.1
# Изоляция: ПК2 не должен знать о других сетях ПК1
dhcp-option=option:domain-search,
